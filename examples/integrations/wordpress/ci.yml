# Generated by `rilavo init --framework wordpress`
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: actions/setup-php@v4
        with:
          8.2: '8.2'
          cache: 'composer'
      - name: Install dependencies
        run: composer install
      - name: Run tests
        run: composer test
      - name: Lint
        run: composer cs-check
