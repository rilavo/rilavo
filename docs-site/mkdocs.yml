      - Terminology & Semantics: protocol/02-terminology-and-semantics.md
      - Problem & Wedge: protocol/03-problem-and-wedge.md
      - Protocol Principles: protocol/04-protocol-principles.md
      - Actor & Trust Model: protocol/05-actor-and-trust-model.md
      - Credential Specification: protocol/06-credential-specification.md
      - Authorization Model: protocol/07-authorization-model.md
      - Revocation Specification: protocol/09-revocation-specification.md
      - Audit Receipts: protocol/10-audit-receipts.md
      - Cryptographic Specification: protocol/11-cryptographic-specification.md
      - Key Management: protocol/12-key-management.md
      - Privacy Architecture: protocol/13-privacy-architecture.md
      - Data Model: protocol/14-data-model.md
      - Network Architecture: protocol/15-network-architecture.md
      - Discovery & Key Directory: protocol/17-discovery-and-key-directory.md
      - Interoperability: protocol/18-interoperability-specification.md
      - API Specification: protocol/19-api-specification.md
      - SDK Specification: protocol/20-sdk-specification.md
      - Security Threat Model: protocol/22-security-threat-model.md
      - Security Response Model: protocol/23-security-response-model.md
      - Versioning: protocol/26-versioning.md
      - Self-Hosting Guide: protocol/32-self-hosting-guide.md
      - Delegation & Attenuation: protocol/08-delegation-and-attenuation.md
      - Compliance Products: protocol/10-compliance-products.md
  - API Reference:
      - Overview: api/reference.md
      - TypeScript SDK: api/typescript/index.md
      - Python SDK: api/python/index.md
      - Go SDK: api/go/index.md
      - Next.js Middleware: api/nextjs/index.md
      - WordPress Plugin: api/wordpress/index.md
  - Migrations:
      - v0.0 to v0.1: migrations/v0.0_to_v0.1.md
      - v0.1 to v0.2: migrations/v0.1_to_v0.2.md

  - SDKs:
