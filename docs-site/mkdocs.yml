site_name: Rilavo
site_description: Stateless, cryptographically signed agent authorization credentials — verify without a network call
site_author: Rilavo Contributors
site_url: https://docs.rilavo.org
repo_url: https://github.com/rilavo/rilavo
repo_name: rilavo/rilavo
edit_uri: edit/main/docs-site/docs/
copyright: Copyright &copy; 2024 Rilavo Contributors — Apache-2.0

# Theme configuration
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  favicon: assets/favicon.ico
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - toc.integrate
  custom_dir: overrides

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: rilavo
      repo: rilavo
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: docs
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-]+'
  - minify:
      minify_html: true
  # - git-revision-date-localized:
      # enable_creation_date: true
      # type: date
      # fallback_to_build_date: true
  # - git-authors:
      # enabled: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../../rilavo-protocol/src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            show_signature_annotations: true
            signature_crossrefs: true
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: false
        typescript:
          paths: [../../packages/rilavo-ts/src]
        # go handler not available - using placeholder

# Extra CSS/JS
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - scripts/playground.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

# Extra configuration
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rilavo/rilavo
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/rilavo
  generator: false
  alternate:
    - name: Protocol Specification
      link: /protocol/
      type: text/html
# analytics:
#   provider: plausible
#   domain: docs.rilavo.org

