version: 2
updates:
  # Python dependencies (root pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Go SDK
  - package-ecosystem: "gomod"
    directory: "/sdks/go"
    schedule:
      interval: "weekly"

  # TypeScript SDK
  - package-ecosystem: "npm"
    directory: "/sdks/typescript"
    schedule:
      interval: "weekly"

  # Next.js SDK
  - package-ecosystem: "npm"
    directory: "/sdks/nextjs"
    schedule:
      interval: "weekly"

  # WordPress SDK (composer)
  - package-ecosystem: "composer"
    directory: "/sdks/wordpress"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
