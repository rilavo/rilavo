name: WordPress Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/rilavo-wp/**'
      - '.github/workflows/wp-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/rilavo-wp/**'
      - '.github/workflows/wp-tests.yml'

jobs:
  wp-tests:
    name: WordPress PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict
        working-directory: ./packages/rilavo-wp

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: ./packages/rilavo-wp

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testdox
        working-directory: ./packages/rilavo-wp

      - name: Check PHP syntax
        run: find . -name "*.php" -exec php -l {} \; | grep -v "No syntax errors"
        working-directory: ./packages/rilavo-wp

  wp-lint:
    name: WordPress Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring
          coverage: none

      - name: Install PHP_CodeSniffer
        run: composer global require "squizlabs/php_codesniffer=*"
        working-directory: ./packages/rilavo-wp

      - name: Install WordPress Coding Standards
        run: |
          composer global require "wp-coding-standards/wpcs=*"
          phpcs --config-set installed_paths ~/.composer/vendor/wp-coding-standards/wpcs
        working-directory: ./packages/rilavo-wp

      - name: Run PHP_CodeSniffer
        run: ~/.composer/vendor/bin/phpcs --standard=WordPress src/
        working-directory: ./packages/rilavo-wp
