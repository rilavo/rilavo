name: WordPress Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdks/wordpress/**'
      - '.github/workflows/wp-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'sdks/wordpress/**'
      - '.github/workflows/wp-tests.yml'

jobs:
  wp-tests:
    name: WordPress PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
      fail-fast: false

    defaults:
      run:
        working-directory: ./sdks/wordpress

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit tests (Golden Vector only)
        run: vendor/bin/phpunit --filter GoldenVector --testdox

  wp-lint:
    name: WordPress Code Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdks/wordpress

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=WordPress --extensions=php includes/ || true
