name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  # Python Protocol Tests
  protocol-tests:
    name: Protocol Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        run: uv run pytest tests/ -q
      - name: Type check (mypy)
        run: uv run mypy src/rilavo --ignore-missing-imports
      - name: Lint (ruff)
        run: uv run ruff check src/rilavo tests/

  # Go SDK Tests
  go-tests:
    name: Go SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdks/go
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test -v ./...

  # TypeScript SDK Tests
  ts-tests:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Upload TypeScript SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rilavo-ts-sdk
          path: |
            sdks/typescript/dist
            sdks/typescript/package.json
          retention-days: 1

  # Next.js SDK Tests
  next-tests:
    name: Next.js SDK Tests
    runs-on: ubuntu-latest
    needs: ts-tests
    defaults:
      run:
        working-directory: ./sdks/nextjs
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: sdks/nextjs/package-lock.json
      - name: Download TypeScript SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: rilavo-ts-sdk
          path: ../typescript
      - name: Install TypeScript SDK
        run: |
          cd ../typescript
          npm pack
          TARBALL=$(ls rilavo-*.tgz)
          cd ../nextjs
          npm install ../typescript/$TARBALL
      - name: Install Next.js dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  # WordPress SDK Tests
  wp-tests:
    name: WordPress PHP Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
      fail-fast: false
    defaults:
      run:
        working-directory: ./sdks/wordpress
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testdox

  # Installation Tests
  install-tests:
    name: Installation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Build package
        run: uv build
      - name: Test installation
        run: |
          pip install dist/*.whl
          python -c "import rilavo; print('rilavo version:', rilavo.__version__)"

  # Smoke Tests
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run smoke test
        run: uv run rilavo smoke
      - name: Run doctor
        run: uv run rilavo doctor

  # Version Check
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pyproject.toml version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "//' | sed 's/"//')
          echo "pyproject.toml version: $VERSION"
      - name: Check Python package version
        run: |
          cd src/rilavo
          PY_VERSION=$(grep '__version__' __init__.py | sed 's/.*= "//' | sed 's/"//')
          echo "Python package version: $PY_VERSION"
      - name: Check versions match
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "//' | sed 's/"//')
          PY_VERSION=$(grep '__version__' src/rilavo/__init__.py | sed 's/.*= "//' | sed 's/"//')
          if [ "$VERSION" != "$PY_VERSION" ]; then
            echo "Version mismatch: pyproject.toml=$VERSION vs __init__.py=$PY_VERSION"
            exit 1
          fi
          echo "Versions match: $VERSION"

  # Documentation Check
  docs-check:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        run: |
          # Check that all docs/ references in README exist
          grep -oE '\(docs/[^)]+\)' README.md | sed 's/[()]//g' | while read path; do
            if [ ! -e "$path" ]; then
              echo "BROKEN LINK: $path"
              exit 1
            fi
          done
          echo "All README links valid"

  # Packaging Check
  packaging-check:
    name: Packaging Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install twine
        run: uv pip install --system twine
      - name: Build and validate
        run: |
          uv build
          uv run twine check dist/*

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [protocol-tests, go-tests, ts-tests, next-tests, wp-tests, install-tests, smoke-tests, version-check, docs-check, packaging-check]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "All CI checks completed"
          # GitHub Actions handles overall status automatically
