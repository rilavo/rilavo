name: SDK Conformance & Golden Vector Parity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  conformance:
    name: Cross-SDK Golden Vector Parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies (protocol)
        run: uv sync --all-extras

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go dependencies
        run: |
          cd sdks/go
          go mod download

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install TypeScript SDK dependencies
        run: |
          cd sdks/typescript
          npm ci

      - name: Build TypeScript SDK
        run: |
          cd sdks/typescript
          npm run build

      - name: Install Next.js SDK dependencies
        run: |
          cd sdks/nextjs
          npm ci

      - name: Build Next.js SDK
        run: |
          cd sdks/nextjs
          npm run build

      - name: Setup PHP for WordPress
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, mbstring, json, curl
          tools: composer:v2

      - name: Install WordPress SDK dependencies
        run: |
          cd sdks/wordpress
          composer install --no-interaction --no-progress

      - name: Run Cross-SDK Conformance Tests
        id: conformance
        run: |
          uv run python scripts/generate_golden_vectors.py
          uv run pytest tests/test_golden_corpus.py -v

  conformance-local:
    name: Local Conformance Self-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run local conformance
        run: uv run rilavo conformance --target local
      - name: Run HTTP conformance (with service)
        run: |
          # Start service in background
          uv run rilavo service --port 8090 --metrics-port 9090 &
          SERVICE_PID=$!
          sleep 5
          # Run conformance against local service
          uv run rilavo conformance --target http://localhost:8090
          # Cleanup
          kill $SERVICE_PID

  golden-vectors:
    name: Generate & Verify Golden Vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Generate golden vectors
        run: uv run python scripts/generate_golden_vectors.py
      - name: Verify golden corpus
        run: uv run pytest tests/test_golden_corpus.py -v
      - name: Check vector files exist
        run: |
          test -f golden/golden.json
          test -f golden/rejects.json
          echo "Golden vector files present"
