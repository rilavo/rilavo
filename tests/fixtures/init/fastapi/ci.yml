# Generated by `rilavo init --framework fastapi`
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          3.11: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e .
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
